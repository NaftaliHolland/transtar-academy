<section class="mx-auto max-w-4xl px-6 pt-16 md:pt-20 {% if value.align == 'center' %}text-center{% endif %}">
  <h2 class="text-4xl font-semibold tracking-[.02em] md:text-5xl">{{ value.heading }}</h2>
  {% if value.text %}<div class="rich-text rich-text-inline mt-5 font-light">{{ value.text }}</div>{% endif %}
</section>
