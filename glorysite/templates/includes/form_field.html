{# Accessible form field: visible label, hint/error linked with aria-describedby. #}
<div class="space-y-2">
  <label for="{{ field.id_for_label }}" class="block font-semibold">{{ field.label }}</label>
  {% if field.field.widget.input_type == "select" or field.widget_type == "select" %}
    <select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="w-full border border-ink/60 bg-white px-4 py-3" {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %} {% if field.field.required %}required{% endif %}>
      {% for value, label in field.field.choices %}<option value="{{ value }}" {% if field.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  {% elif field.widget_type == "textarea" %}
    <textarea name="{{ field.html_name }}" id="{{ field.id_for_label }}" rows="6" class="w-full border border-ink/60 bg-white px-4 py-3" {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %} {% if field.field.required %}required{% endif %} maxlength="{{ field.field.max_length }}">{{ field.value|default_if_none:"" }}</textarea>
  {% else %}
    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" value="{{ field.value|default_if_none:'' }}" class="w-full border border-ink/60 bg-white px-4 py-3" {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %} {% if field.field.required %}required{% endif %} {% for k, v in field.field.widget.attrs.items %}{{ k }}="{{ v }}" {% endfor %} />
  {% endif %}
  {% if field.errors %}<p id="{{ field.id_for_label }}-error" class="font-medium text-[#b00020]">{{ field.errors.0 }}</p>{% endif %}
</div>
