<dialog id="siteDialog" class="m-auto w-[min(90vw,520px)] bg-white p-0 text-ink backdrop:bg-black/60" aria-labelledby="siteDialogTitle">
  <div class="p-8">
    <button type="button" data-dialog-close class="float-right text-3xl leading-none" aria-label="Close dialog">&times;</button>
    <h2 id="siteDialogTitle" class="text-3xl font-semibold"></h2>
    <p id="siteDialogText" class="mt-4 text-lg leading-relaxed"></p>
    <a id="siteDialogLink" href="#" hidden class="mt-6 inline-block bg-navy px-5 py-3 text-white hover:bg-steel"></a>
  </div>
</dialog>
<dialog id="lightbox" class="m-auto max-h-[92vh] w-[min(94vw,1100px)] bg-ink p-0 text-white backdrop:bg-black/80" aria-label="Image viewer">
  <figure class="p-4">
    <img id="lightboxImage" src="" alt="" class="mx-auto max-h-[75vh] w-auto max-w-full object-contain" />
    <figcaption id="lightboxCaption" class="mt-3 min-h-6 text-center text-sm"></figcaption>
  </figure>
  <div class="flex justify-between gap-3 px-4 pb-4 text-sm font-semibold">
    <button type="button" data-lightbox-prev class="bg-white px-4 py-2 text-ink">Previous</button>
    <button type="button" data-lightbox-close class="bg-gold px-4 py-2 text-ink">Close</button>
    <button type="button" data-lightbox-next class="bg-white px-4 py-2 text-ink">Next</button>
  </div>
</dialog>
